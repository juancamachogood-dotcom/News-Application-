{% extends "base.html" %}

{% block title %}
  Access denied · The Daily Brief
{% endblock %}

{% block content %}

    <span class="danger-icon">403</span>

    <p class="eyebrow">Access denied</p>

    <h1>
      This page is not available for your role.
    </h1>

    <p>
      Your account is working, but you do not have permission

    <a
      class="button button-primary"
      href="% url 'dashboard' %"
    >
      Return to overview
    </a>
  </section>
{% endblock %}
